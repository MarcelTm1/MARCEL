# MARCEL // HACKER MODE
# Compatible with the official Termux properties format.

use-black-ui = true
bell-character = ignore
terminal-cursor-style = bar
terminal-cursor-blink-rate = 600
terminal-transcript-rows = 10000
terminal-margin-horizontal = 4
extra-keys-style = default

# Keep this format simple and parser-safe: quoted keys, no nested popup objects.
extra-keys = [['ESC','/','-','HOME','UP','END','PGUP'], \
              ['TAB','CTRL','ALT','LEFT','DOWN','RIGHT','PGDN']]
