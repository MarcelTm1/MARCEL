# MARCEL for Termux
# Touch-friendly controls and a distraction-free terminal layout.

use-black-ui = true
bell-character = ignore
terminal-cursor-style = bar
terminal-cursor-blink-rate = 600
terminal-transcript-rows = 10000
terminal-margin-horizontal = 4

# Swipe up on an arrow key for its paired navigation action.
extra-keys = [[ \
  {key: ESC, popup: KEYBOARD}, \
  {key: '/', popup: '\\'}, \
  {key: '-', popup: '_'}, \
  {key: HOME, popup: PGUP}, \
  {key: UP, popup: PGUP}, \
  {key: END, popup: PGDN}, \
  {key: ':', popup: ';'} \
], [ \
  {key: TAB, popup: SHIFT}, \
  CTRL, \
  ALT, \
  {key: LEFT, popup: HOME}, \
  {key: DOWN, popup: PGDN}, \
  {key: RIGHT, popup: END}, \
  {key: '~', popup: '`'} \
]]
